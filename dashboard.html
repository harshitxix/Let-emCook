<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let'emCook - Audit Log</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --primary-color: #10b981;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --danger-color: #ef4444;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .title {
            font-size: 32px;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(90deg, #10b981, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            color: var(--text-sub);
            margin: 5px 0 0 0;
            font-size: 14px;
        }

        .clear-btn {
            background-color: transparent;
            border: 1px solid var(--danger-color);
            color: var(--danger-color);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .clear-btn:hover {
            background-color: rgba(239, 68, 68, 0.1);
        }

        .log-table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--surface-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .log-table th {
            background-color: rgba(0, 0, 0, 0.2);
            padding: 16px;
            text-align: left;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-sub);
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
        }

        .log-table td {
            padding: 16px;
            font-size: 14px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: top;
        }

        .log-table tr:last-child td {
            border-bottom: none;
        }

        .log-table tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge.banner {
            background-color: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .badge.tracker {
            background-color: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .badge.engine-ai {
            background-color: rgba(168, 85, 247, 0.2);
            color: #c084fc;
        }

        .badge.engine-regex {
            background-color: rgba(16, 185, 129, 0.2);
            color: #34d399;
        }
        
        .badge.engine-dnr {
            background-color: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
        }

        .timestamp {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-sub);
            font-size: 12px;
        }

        .domain {
            font-weight: 600;
            color: var(--text-main);
        }

        .reason {
            color: var(--text-sub);
            font-size: 13px;
            margin-top: 4px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-sub);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1 class="title">Audit Log</h1>
                <p class="subtitle">A detailed history of all privacy actions taken by Let'emCook.</p>
            </div>
            <button class="clear-btn" id="clearLogBtn">Clear History</button>
        </div>

        <table class="log-table" id="logTable">
            <thead>
                <tr>
                    <th width="15%">Time</th>
                    <th width="25%">Domain</th>
                    <th width="15%">Action</th>
                    <th width="15%">Engine</th>
                    <th width="30%">Details</th>
                </tr>
            </thead>
            <tbody id="logBody">
                <!-- Rows injected via JS -->
            </tbody>
        </table>
        
        <div id="emptyState" class="empty-state" style="display: none;">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.5; margin-bottom: 16px;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            <h2>No actions recorded yet</h2>
            <p>Browse the web and Let'emCook will log its assassinations here.</p>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
